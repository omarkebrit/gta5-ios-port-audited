name: Build my IPA

on:
  workflow_dispatch:
    inputs:
      input_release:
        description: 'Temporary private input release created by tools/build_from_windows.py'
        type: string
        required: true
      input_sha256:
        description: 'SHA-256 of gta5-build-inputs.zip (printed by the uploader)'
        type: string
        required: true
      paid_account:
        description: 'Request memory entitlements for a paid Apple developer team'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: private-ipa-build
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INPUT_RELEASE: ${{ inputs.input_release }}
      INPUT_SHA256: ${{ inputs.input_sha256 }}
    steps:
      - name: Require a private repository
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$PRIVATE" != true ]; then
            echo '::error::This build requires a private repository because the IPA contains proprietary engine and shaders.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download and validate only the minimal user-supplied inputs
        run: |
          [[ "$INPUT_RELEASE" =~ ^build-inputs-[0-9a-f]{16}$ ]] || { echo '::error::Run the Windows uploader to supply the required inputs.'; exit 1; }
          [[ "$INPUT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo '::error::Missing or invalid input checksum.'; exit 1; }
          gh release download "$INPUT_RELEASE" --repo "$REPO" --pattern gta5-build-inputs.zip --dir "$RUNNER_TEMP/inputs"
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/inputs/gta5-build-inputs.zip" | sha256sum --check
          python3 app/Scripts/minimal_inputs.py unpack --zip "$RUNNER_TEMP/inputs/gta5-build-inputs.zip" --out "$RUNNER_TEMP/game-files"
      - name: Remove runner copies
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/game-files"

  build:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write # Delete only the temporary input release after successful verification.
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      INPUT_RELEASE: ${{ inputs.input_release }}
      INPUT_SHA256: ${{ inputs.input_sha256 }}
      PYTHON: python3
      JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Confirm Apple Silicon and record toolchain
        run: |
          test "$(uname -m)" = arm64
          mkdir -p app/Build/Audit
          { uname -a; xcodebuild -version; python3 --version; } > app/Build/Audit/environment.log
      - name: Install project and Metal build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcrun -sdk iphoneos metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Download and verify minimal inputs
        run: |
          gh release download "$INPUT_RELEASE" --repo "$REPO" --pattern gta5-build-inputs.zip --dir "$RUNNER_TEMP/inputs"
          printf '%s  %s\n' "$INPUT_SHA256" "$RUNNER_TEMP/inputs/gta5-build-inputs.zip" | shasum -a 256 --check
          python3 app/Scripts/minimal_inputs.py unpack --zip "$RUNNER_TEMP/inputs/gta5-build-inputs.zip" --out "$RUNNER_TEMP/game-files"
      - name: Build ARM64 application for local game files
        env:
          PAID: ${{ inputs.paid_account }}
        run: |
          if [ "$PAID" = true ]; then
            ./build_ipa.sh --mirror "$RUNNER_TEMP/game-files" --paid
          else
            ./build_ipa.sh --mirror "$RUNNER_TEMP/game-files"
          fi
      - name: Verify ad-hoc code signature and IPA structure
        run: |
          codesign --verify --deep --strict app/Build/Release/Build/Products/Release-iphoneos/PlayGTA5Native.app
          python3 app/Scripts/verify_ipa.py GTA5Port.ipa --report app/Build/Audit/ipa-verification.json
      - name: Save the IPA as a private Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GTA5Port-ipa
          path: |
            GTA5Port.ipa
            app/Build/Audit/ipa-verification.json
          if-no-files-found: error
          retention-days: 3
      - name: Delete successful build inputs from GitHub
        run: gh release delete "$INPUT_RELEASE" --repo "$REPO" --yes --cleanup-tag
      - name: Remove private input and generated runner copies
        if: ${{ always() }}
        run: |
          rm -rf "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/game-files" app/Generated app/GeneratedResources app/Build/Inputs app/Build/MetalShaders app/Resources/manifest.json
      - name: Save minimal build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics
          path: |
            app/Build/Audit/*.log
            app/Build/Audit/*.json
          if-no-files-found: warn
          retention-days: 3
